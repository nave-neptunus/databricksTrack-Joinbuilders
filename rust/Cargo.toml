[package]
name = "rproto"
version = "0.1.0"
edition = "2024"

[features]
default = ["hex-users"]
hex-users = []
# Nova's claim streams and dedup routers share this compile-time count. Larger
# values keep each router table closer to cache at the cost of more stream
# metadata and shorter per-shard work.
nova-shards-512 = []
nova-shards-1024 = []
nova-shards-2048 = []

[dependencies]
ahash = "0.8.12"
arrow-array = "60.1.0"
arrow-schema = "60.1.0"
bytes = "1"
memchr = "2.8.3"
memmap2 = "0.9.12"
parquet = { version = "60.1.0", default-features = false, features = ["arrow"] }
rayon = "1.12.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
