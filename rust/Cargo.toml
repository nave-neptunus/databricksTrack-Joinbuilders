[package]
name = "rproto"
version = "0.1.0"
edition = "2024"

[dependencies]
ahash = "0.8.12"
arrow-array = "60.1.0"
arrow-schema = "60.1.0"
bytes = "1"
memchr = "2.8.3"
memmap2 = "0.9.12"
parquet = { version = "60.1.0", default-features = false, features = ["arrow"] }
lz4_flex = { version = "0.11", default-features = false, features = ["std"] }
rayon = "1.12.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
