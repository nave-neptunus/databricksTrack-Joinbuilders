name: dedup candidates cargo test

on:
  push:
    branches: [ci/gum-dedup-check]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        sha:
          - 7c28e420e476b6df40f623ceed6eae767b387737
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Test ${{ matrix.sha }}
        shell: bash
        run: |
          set -euo pipefail
          lscpu | grep -i 'model name'
          git checkout -q ${{ matrix.sha }}
          RUSTFLAGS="-C target-cpu=x86-64-v3" cargo test --locked --manifest-path rust/Cargo.toml 2>&1 | tail -40
