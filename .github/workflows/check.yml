name: dedup candidates cargo test

on:
  push:
    branches: [ci/gum-dedup-check]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        sha:
          - 531c2dc5c0706742242615ba523abb2a29313510
          - 563ccb8d1294333ddbf4dd361028da19ea6fb188
          - f88df38c12c103700ab5a3e219c9b54ffd48be12
          - cbf00604db96a0bca78a7f35dae87c464080e781
          - 167f273ff04dbd492e4aa30f49c66f2195eb355e
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Test ${{ matrix.sha }}
        shell: bash
        run: |
          set -euo pipefail
          lscpu | grep -i 'model name'
          git checkout -q ${{ matrix.sha }}
          RUSTFLAGS="-C target-cpu=x86-64-v3" cargo test --locked --manifest-path rust/Cargo.toml 2>&1 | tail -40
