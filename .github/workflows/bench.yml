name: g7 final safety measurement

on:
  push:
    branches: [g7/bench-ci]

env:
  DATA_SEED: "3"

jobs:
  build-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Build ed40599 once for linux/amd64
        run: |
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          SHA=$(git rev-parse 'ed40599^{commit}')
          git archive --format=tar "$SHA" | docker build --platform linux/amd64 --load --tag g7-bench-baseline -
          docker save g7-bench-baseline | zstd -T0 -3 -o "$RUNNER_TEMP/g7-bench-baseline.tar.zst"
      - uses: actions/upload-artifact@v4
        with:
          name: image-baseline
          path: ${{ runner.temp }}/g7-bench-baseline.tar.zst
          retention-days: 1

  final-safety:
    needs: build-baseline
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Intel AVX-512 capacity gate
        run: |
          lscpu
          free -h
          df -h /
          if ! grep -qm1 '^vendor_id.*GenuineIntel' /proc/cpuinfo || ! grep -qw avx512f /proc/cpuinfo; then
            echo 'Intel AVX512F=no; refusing non-representative safety run' >&2
            exit 1
          fi
          echo "NCPU=$(nproc)" >> "$GITHUB_ENV"
          printf 'THP: '; cat /sys/kernel/mm/transparent_hugepage/enabled
      - name: Fetch pinned generator and comparator
        id: generator
        run: |
          git fetch --no-tags origin ci-bench:refs/remotes/origin/ci-bench
          echo "tree=$(git rev-parse origin/ci-bench:generator)" >> "$GITHUB_OUTPUT"
          git checkout origin/ci-bench -- generator scripts
      - name: Restore practice corpus cache
        id: corpus
        uses: actions/cache@v4
        with:
          path: ~/big20
          key: big20-${{ runner.os }}-seed${{ env.DATA_SEED }}-${{ steps.generator.outputs.tree }}
      - run: python3 -m pip install --quiet polars
      - name: Generate practice corpus on a cache miss
        if: steps.corpus.outputs.cache-hit != 'true'
        run: |
          cargo build --release --locked --manifest-path generator/Cargo.toml
          generator/target/release/generate --seed "$DATA_SEED" --events 20000000 --clicks 5000000 --output "$HOME/big20"
      - name: Generate final-scale corpus (seed 17)
        run: |
          free_gb=$(df -BG "$HOME" | awk 'NR==2 {gsub(/G/, "", $4); print $4}')
          if [ "$free_gb" -ge 20 ]; then events=60000000; clicks=15000000; else events=40000000; clicks=10000000; fi
          echo "FINAL_EVENTS=$events" >> "$GITHUB_ENV"
          echo "FINAL_CLICKS=$clicks" >> "$GITHUB_ENV"
          echo "FINAL_DISK_GB_BEFORE=$free_gb" >> "$GITHUB_ENV"
          cargo build --release --locked --manifest-path generator/Cargo.toml
          generator/target/release/generate --seed 17 --events "$events" --clicks "$clicks" --output "$HOME/big-final"
          du -sh "$HOME/big-final"
          df -h /
      - uses: actions/download-artifact@v4
        with:
          name: image-baseline
          path: ${{ runner.temp }}/image
      - name: Load cached baseline image
        run: zstd -dc "$RUNNER_TEMP"/image/*.tar.zst | docker load
      - name: Final-scale correctness and fallback check
        run: |
          set -euo pipefail
          work="$HOME/g7-final-safety"
          mkdir -p "$work"/large-ref "$work"/large-ref-scratch "$work"/large-fast "$work"/large-fast-scratch
          chmod -R 777 "$work"
          docker_run() {
            entry="$1"; data="$2"; out="$3"; scratch="$4"; err="$5"
            docker run --rm --network none --read-only --tmpfs /tmp:rw,size=64m,mode=1777 --cap-drop ALL --security-opt no-new-privileges --memory 12g --memory-swap 12g --user 1000:1000 \
              -v "$data:/data:ro" -v "$out:/output" -v "$scratch:/scratch" \
              -e "NCPU=$NCPU" -e DATA_DIR=/data -e OUTPUT_DIR=/output -e SCRATCH_DIR=/scratch -e XL_TIMING=1 \
              --entrypoint "$entry" g7-bench-baseline 2>"$err"
          }
          seconds() { awk -v a="$1" -v b="$2" 'BEGIN {printf "%.6f", (b-a)/1000000000}'; }
          # /fallback is the independent reference on exactly the same corpus.
          begin=$(date +%s%N); docker_run /fallback "$HOME/big-final" "$work/large-ref" "$work/large-ref-scratch" "$work/fallback.stderr"; end=$(date +%s%N)
          fallback_s=$(seconds "$begin" "$end")
          find "$HOME/big-final" -type f -exec cat {} + >/dev/null
          begin=$(date +%s%N); docker_run /pipeline "$HOME/big-final" "$work/large-fast" "$work/large-fast-scratch" "$work/final.stderr"; end=$(date +%s%N)
          final_s=$(seconds "$begin" "$end")
          python3 scripts/compare.py "$work/large-fast" "$work/large-ref" | tee "$work/compare.txt"
          grep -q 'MATCH$' "$work/compare.txt"
          if grep -qi fallback "$work/final.stderr"; then echo 'FAIL: fast path emitted fallback' >&2; exit 1; fi
          final_engine=$(sed -n 's/.*exit at \([0-9.]*\) ms.*/\1/p' "$work/final.stderr" | tail -1)
          final_rss=$(sed -n 's/.*peak_rss_kb=\([0-9]*\).*/\1/p' "$work/final.stderr" | tail -1)
          test -n "$final_engine"; test -n "$final_rss"
          cat > "$work/summary.md" <<EOF
          # Final safety measurement
          final_events=$FINAL_EVENTS final_clicks=$FINAL_CLICKS seed=17 disk_gb_before=$FINAL_DISK_GB_BEFORE
          final_reference_container_seconds=$fallback_s
          final_fast_container_seconds=$final_s
          final_fast_engine_ms=$final_engine
          final_peak_rss_kb=$final_rss
          final_exact_output=MATCH
          final_fallback_line=ABSENT
          EOF
          cat "$work/summary.md"
      - name: AVX-512 disassembly audit (baseline and lanes8)
        run: |
          set -euo pipefail
          work="$HOME/g7-final-safety"
          audit_one() {
            sha="$1"; tag="$2"; name="$3"
            if [ "$tag" != g7-bench-baseline ]; then
              git archive --format=tar "$sha" | docker build --platform linux/amd64 --load --tag "$tag" -
            fi
            cid=$(docker create "$tag")
            docker cp "$cid:/pipeline" "$work/$name.pipeline"
            docker rm "$cid"
            objdump -d --no-show-raw-insn --demangle "$work/$name.pipeline" > "$work/$name.objdump"
            python3 bench/avx512_audit.py --commit "$sha" --objdump "$work/$name.objdump" --output "$work/$name-avx512.md"
            cat "$work/$name-avx512.md"
          }
          audit_one ed40599 g7-bench-baseline ed40599
          audit_one 6fafb87 g7-bench-lanes8 6fafb87
      - name: Fixed container overhead after audit
        run: |
          set -euo pipefail
          work="$HOME/g7-final-safety"
          mkdir -p "$work"/empty-out "$work"/empty-scratch "$work"/real20-out "$work"/real20-scratch
          chmod -R 777 "$work"
          docker_run() {
            data="$1"; out="$2"; scratch="$3"; err="$4"
            docker run --rm --network none --read-only --tmpfs /tmp:rw,size=64m,mode=1777 --cap-drop ALL --security-opt no-new-privileges --memory 12g --memory-swap 12g --user 1000:1000 \
              -v "$data:/data:ro" -v "$out:/output" -v "$scratch:/scratch" \
              -e "NCPU=$NCPU" -e DATA_DIR=/data -e OUTPUT_DIR=/output -e SCRATCH_DIR=/scratch -e XL_TIMING=1 \
              --entrypoint /pipeline g7-bench-baseline 2>"$err"
          }
          seconds() { awk -v a="$1" -v b="$2" 'BEGIN {printf "%.6f", (b-a)/1000000000}'; }
          # The scratch image deliberately has neither /bin/true nor a shell.
          # An empty DATA_DIR makes /pipeline fail during its first lookup; it
          # is still the closest start->exit proxy available in this image.
          empty="$work/empty-input"; mkdir -p "$empty"
          begin=$(date +%s%N)
          set +e
          docker_run "$empty" "$work/empty-out" "$work/empty-scratch" "$work/empty.stderr"
          empty_exit=$?
          set -e
          end=$(date +%s%N)
          empty_s=$(seconds "$begin" "$end")
          find "$HOME/big20" -type f -exec cat {} + >/dev/null
          begin=$(date +%s%N); docker_run "$HOME/big20" "$work/real20-out" "$work/real20-scratch" "$work/real20.stderr"; end=$(date +%s%N)
          real20_s=$(seconds "$begin" "$end")
          real20_engine=$(sed -n 's/.*exit at \([0-9.]*\) ms.*/\1/p' "$work/real20.stderr" | tail -1)
          test -n "$real20_engine"
          cat >> "$work/summary.md" <<EOF
          empty_input_container_seconds=$empty_s
          empty_input_exit_code=$empty_exit
          warm_20m_container_seconds=$real20_s
          warm_20m_engine_ms=$real20_engine
          EOF
          cat "$work/summary.md"
      - if: always()
        run: cat "$HOME/g7-final-safety/summary.md" >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-safety-${{ github.run_id }}-${{ github.run_attempt }}
          path: |-
            ~/g7-final-safety/summary.md
            ~/g7-final-safety/*.stderr
            ~/g7-final-safety/compare.txt
            ~/g7-final-safety/*-avx512.md
          retention-days: 7
