name: g7 v5 60M Intel benchmark

on:
  push:
    branches: [g7/bench-v5]

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Require Intel AVX-512 and pin eight vCPUs
        run: |
          lscpu
          if ! grep -qm1 '^vendor_id.*GenuineIntel' /proc/cpuinfo || ! grep -qw avx512f /proc/cpuinfo; then
            echo 'Intel AVX512F=no; refusing non-representative run' >&2
            exit 1
          fi
          have=$(nproc)
          if [ "$have" -ge 8 ]; then use=8; else use=$have; fi
          echo "NCPU=$use" >> "$GITHUB_ENV"
          echo "RUNNER_VCPUS=$have" >> "$GITHUB_ENV"
      - name: Fetch fixtures and comparator only
        run: |
          git fetch --no-tags origin ci-bench:refs/remotes/origin/ci-bench
          git checkout origin/ci-bench -- fixtures scripts bench/ci_bench.py
      - name: Build v5 generator and create seed-17 60M corpus
        run: |
          cargo build --release --locked --manifest-path generator/Cargo.toml
          generator/target/release/generate --seed 17 --events 60000000 --clicks 15000000 --output "$HOME/big60" --threads "$NCPU"
          du -sh "$HOME/big60"
      - name: Build baseline first
        run: |
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          git archive --format=tar 6da0386b4ca6a001a5c7f747c68f40815fc14afb | docker build --platform linux/amd64 --load --tag g7-v5-baseline -
      - name: Baseline v5 fast-path report
        run: |
          mkdir -p "$HOME/v5-baseline/out" "$HOME/v5-baseline/scratch"
          chmod 777 "$HOME/v5-baseline/out" "$HOME/v5-baseline/scratch"
          start=$(date +%s%N)
          docker run --rm --network none --read-only --tmpfs /tmp:rw,size=64m,mode=1777 --cap-drop ALL --security-opt no-new-privileges --memory 24g --memory-swap 24g --user 1000:1000 -v "$HOME/big60:/data:ro" -v "$HOME/v5-baseline/out:/output" -v "$HOME/v5-baseline/scratch:/scratch" -e "NCPU=$NCPU" -e DATA_DIR=/data -e OUTPUT_DIR=/output -e SCRATCH_DIR=/scratch -e XL_TIMING=1 g7-v5-baseline 2>"$HOME/v5-baseline/stderr"
          end=$(date +%s%N)
          awk -v a="$start" -v b="$end" 'BEGIN {printf "baseline_container_seconds=%.6f\n", (b-a)/1000000000}' > "$HOME/v5-baseline/report.txt"
          sed -n 's/.*exit at \([0-9.]*\) ms.*/baseline_engine_ms=\1/p' "$HOME/v5-baseline/stderr" >> "$HOME/v5-baseline/report.txt"
          if grep -qi fallback "$HOME/v5-baseline/stderr"; then echo 'baseline_fast_path=FALLBACK' >> "$HOME/v5-baseline/report.txt"; else echo 'baseline_fast_path=NO_FALLBACK' >> "$HOME/v5-baseline/report.txt"; fi
          cat "$HOME/v5-baseline/report.txt"
      - name: Build valid candidates
        run: |
          for spec in \
            gum-agg:1f568fa2a27ff5cd1c19fc136b17e5ff4b3038c6
          do
            label=${spec%%:*}; sha=${spec#*:}
            git archive --format=tar "$sha" | docker build --platform linux/amd64 --load --tag "g7-v5-$label" -
          done
      - name: Eight alternating 60M pairs and exact gates
        run: |
          set -o pipefail
          for spec in \
            gum-agg:1f568fa2a27ff5cd1c19fc136b17e5ff4b3038c6
          do
            label=${spec%%:*}; sha=${spec#*:}
            work="$HOME/v5-$label"; mkdir -p "$work"
            BASELINE_REF=6da0386b4ca6a001a5c7f747c68f40815fc14afb CANDIDATE_REF="$sha" CANDIDATE_LABEL="$sha" BASELINE_IMAGE=g7-v5-baseline CANDIDATE_IMAGE="g7-v5-$label" PAIRS=8 NCPU="$NCPU" python3 bench/ci_bench.py "$HOME/big60" "$work" 2>&1 | tee "$work.log"
          done
      - if: always()
        run: |
          cat "$HOME/v5-baseline/report.txt" >> "$GITHUB_STEP_SUMMARY" || true
          for report in "$HOME"/v5-*/summary.md; do if test -f "$report"; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v5-60m-${{ github.run_id }}-${{ github.run_attempt }}
          path: |-
            ~/v5-baseline/**
            ~/v5-*.log
            ~/v5-*/summary.md
            ~/v5-*/observations.json
            ~/v5-*/logs/**
          retention-days: 7
