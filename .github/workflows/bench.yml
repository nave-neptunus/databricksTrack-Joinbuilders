name: g7 v5 baseline profile (Intel)

on:
  push:
    branches: [g7/bench-v5]
  workflow_dispatch:

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Require Intel AVX-512 and pin eight vCPUs
        run: |
          lscpu
          if ! grep -qm1 '^vendor_id.*GenuineIntel' /proc/cpuinfo || ! grep -qw avx512f /proc/cpuinfo; then
            echo 'Intel AVX512F=no; refusing non-representative run' >&2
            exit 1
          fi
          have=$(nproc)
          if [ "$have" -ge 8 ]; then use=8; else use=$have; fi
          echo "NCPU=$use" >> "$GITHUB_ENV"
          echo "RUNNER_VCPUS=$have" >> "$GITHUB_ENV"
      - name: Fetch fixtures and install their checker dependency
        run: |
          git fetch --no-tags origin ci-bench:refs/remotes/origin/ci-bench
          git checkout origin/ci-bench -- fixtures scripts/run_fixtures.py scripts/compare.py
          # scripts/run_fixtures.py imports polars; keep this beside the script checkout.
          python3 -m pip install --disable-pip-version-check polars
      - name: Install perf for this runner kernel
        run: |
          sudo apt-get update
          sudo apt-get install -y "linux-tools-$(uname -r)" linux-tools-generic
          perf --version
      - name: Build v5 generator and create seed-17 corpora
        run: |
          cargo build --release --locked --manifest-path generator/Cargo.toml
          generator/target/release/generate --seed 17 --events 20000000 --clicks 5000000 --output "$HOME/v5-20m" --threads "$NCPU"
          generator/target/release/generate --seed 17 --events 60000000 --clicks 15000000 --output "$HOME/v5-60m" --threads "$NCPU"
          du -sh "$HOME/v5-20m" "$HOME/v5-60m"
      - name: Build baseline image and host profiling binary
        env:
          BASELINE: 6da0386b4ca6a001a5c7f747c68f40815fc14afb
        run: |
          git archive --format=tar "$BASELINE" | docker build --platform linux/amd64 --load --tag g7-v5-profile -
          mkdir -p "$HOME/g7-profile-source"
          git archive "$BASELINE" | tar -x -C "$HOME/g7-profile-source"
          RUSTFLAGS='-C target-cpu=x86-64-v3' cargo build --release --locked --manifest-path "$HOME/g7-profile-source/rust/Cargo.toml"
          cp "$HOME/g7-profile-source/rust/target/release/rproto" "$HOME/g7-profile-rproto"
          chmod +x "$HOME/g7-profile-rproto"
      - name: Warm and time 20M and 60M baseline runs
        run: |
          set -euo pipefail
          run_profile() {
            size="$1"
            data="$HOME/v5-$size"
            work="$HOME/g7-profile/$size"
            rm -rf "$work"
            mkdir -p "$work/warm-output" "$work/output"
            # The unmeasured first invocation warms executable pages and the corpus page cache.
            DATA_DIR="$data" OUTPUT_DIR="$work/warm-output" SCRATCH_DIR="$work/warm-scratch" NCPU="$NCPU" TIMING=1 GLIBC_TUNABLES=glibc.malloc.hugetlb=1 "$HOME/g7-profile-rproto" 2>"$work/warm.stderr"
            rm -rf "$work/output" "$work/scratch"
            mkdir -p "$work/output"
            DATA_DIR="$data" OUTPUT_DIR="$work/output" SCRATCH_DIR="$work/scratch" NCPU="$NCPU" TIMING=1 GLIBC_TUNABLES=glibc.malloc.hugetlb=1 /usr/bin/time -v "$HOME/g7-profile-rproto" 2>"$work/stderr"
            test -f "$work/output/user_daily/part-0.parquet"
            test -f "$work/output/campaign_daily/part-0.parquet"
          }
          run_profile 20m
          run_profile 60m
      - name: Perf record warm 60M baseline run
        run: |
          set -euo pipefail
          work="$HOME/g7-profile/60m"
          rm -rf "$work/perf-output" "$work/perf-scratch"
          mkdir -p "$work/perf-output"
          # The binary runs on the host because the normal hardened container drops perf capabilities.
          DATA_DIR="$HOME/v5-60m" OUTPUT_DIR="$work/perf-output" SCRATCH_DIR="$work/perf-scratch" NCPU="$NCPU" TIMING=1 GLIBC_TUNABLES=glibc.malloc.hugetlb=1 sudo perf record -g --call-graph dwarf --output "$work/perf.data" -- "$HOME/g7-profile-rproto" 2>"$work/perf.stderr"
          sudo perf report --stdio --no-children --sort symbol --percent-limit 0 --input "$work/perf.data" >"$work/perf-report.txt"
          test -s "$work/perf-report.txt"
      - name: Publish profile evidence
        if: always()
        run: |
          {
            echo '## g7 v5 baseline profile'
            echo
            echo "- baseline: \`6da0386b4ca6a001a5c7f747c68f40815fc14afb\`"
            echo "- runner vCPUs: ${RUNNER_VCPUS:-unknown}; profiled NCPU: ${NCPU:-unknown}"
            for size in 20m 60m; do
              echo
              echo "### ${size} warm timed stderr"
              echo '```text'
              sed -n '/ ms  /p;/User time (seconds)/p;/System time (seconds)/p;/Maximum resident set size/p' "$HOME/g7-profile/$size/stderr" || true
              echo '```'
            done
            echo
            echo '### 60M perf (self time)'
            echo '```text'
            grep -E '^[[:space:]]*[0-9.]+%' "$HOME/g7-profile/60m/perf-report.txt" | head -30 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gum-profile-${{ github.run_id }}-${{ github.run_attempt }}
          path: |-
            ~/g7-profile/**
          retention-days: 7
