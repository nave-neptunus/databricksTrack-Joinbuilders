name: g7 x86 benchmark

on:
  push:
    branches: [g7/bench-ci]

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BASELINE_REF: ed40599
      CANDIDATE_REF: 6fafb87
      PAIRS: "6"
      NCPU: "8"
      DATA_SEED: "3"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Runner capabilities
        run: |
          lscpu
          free -h
          df -h /
          if grep -qw avx512f /proc/cpuinfo; then
            echo 'AVX512F=yes'
          else
            echo 'AVX512F=no; refusing a non-representative run' >&2
            exit 1
          fi
          printf 'baseline=%s candidate=%s pairs=%s ncpu=%s\n' "$BASELINE_REF" "$CANDIDATE_REF" "$PAIRS" "$NCPU"
      - name: Fetch pinned benchmark support
        run: |
          git fetch --no-tags origin ci-bench:refs/remotes/origin/ci-bench
          git checkout origin/ci-bench -- generator fixtures scripts
      - name: Install checker dependency
        run: python3 -m pip install --quiet polars
      - name: Generate 20M corpus
        run: |
          cargo build --release --locked --manifest-path generator/Cargo.toml
          generator/target/release/generate --seed "$DATA_SEED" --events 20000000 --clicks 5000000 --output "$HOME/big20"
          du -sh "$HOME/big20"
      - name: Build, gate, stage profile, and cold A/B timing
        run: python3 bench/ci_bench.py "$HOME/big20" "$HOME/g7-bench" 2>&1 | tee "$HOME/g7-bench.log"
      - name: Publish summary
        if: always()
        run: cat "$HOME/g7-bench/summary.md" >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g7-benchmark-${{ github.run_id }}
          path: |
            ~/g7-bench.log
            ~/g7-bench/**
