name: g7 x86 benchmark

on:
  push:
    branches: [g7/bench-ci]

env:
  DATA_SEED: "3"

jobs:
  build-images:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: baseline, ref: ed40599 }
          - { label: core-runpath, ref: ec7479b }
          - { label: io-fuse, ref: 5f08834 }
          - { label: io-pfd, ref: 603a066 }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Build ${{ matrix.ref }} once for linux/amd64
        env:
          REF: ${{ matrix.ref }}
          LABEL: ${{ matrix.label }}
        run: |
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          SHA=$(git rev-parse "$REF^{commit}")
          git archive --format=tar "$SHA" | docker build --platform linux/amd64 --load --tag "g7-bench-$LABEL" -
          docker save "g7-bench-$LABEL" | zstd -T0 -3 -o "$RUNNER_TEMP/g7-bench-$LABEL.tar.zst"
      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.label }}
          path: ${{ runner.temp }}/g7-bench-${{ matrix.label }}.tar.zst
          retention-days: 1

  benchmark:
    needs: build-images
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: core-runpath, candidate_ref: ec7479b, image: core-runpath, run_tests: 'true' }
          - { label: io-fuse, candidate_ref: 5f08834, image: io-fuse, run_tests: 'true' }
          - { label: io-pfd-0, baseline_ref: 603a066, baseline_image: io-pfd, candidate_ref: 603a066, image: io-pfd, setting: XL_PFD=0 }
          - { label: io-pfd-512, baseline_ref: 603a066, baseline_image: io-pfd, candidate_ref: 603a066, image: io-pfd, setting: XL_PFD=512 }
          - { label: io-pfd-2048, baseline_ref: 603a066, baseline_image: io-pfd, candidate_ref: 603a066, image: io-pfd, setting: XL_PFD=2048 }
          - { label: io-pfd-4096, baseline_ref: 603a066, baseline_image: io-pfd, candidate_ref: 603a066, image: io-pfd, setting: XL_PFD=4096 }
    env:
      BASELINE_REF: ${{ matrix.baseline_ref || 'ed40599' }}
      CANDIDATE_REF: ${{ matrix.candidate_ref }}
      CANDIDATE_ENV: ${{ matrix.setting }}
      BASELINE_IMAGE: g7-bench-${{ matrix.baseline_image || 'baseline' }}
      CANDIDATE_IMAGE: g7-bench-${{ matrix.image }}
      PAIRS: "8"
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Intel AVX-512 capability and thread count
        run: |
          lscpu
          if ! grep -qm1 '^vendor_id.*GenuineIntel' /proc/cpuinfo || ! grep -qw avx512f /proc/cpuinfo; then
            echo 'Intel AVX512F=no; refusing non-representative run' >&2
            exit 1
          fi
          echo "NCPU=$(nproc)" >> "$GITHUB_ENV"
          printf 'THP: '; cat /sys/kernel/mm/transparent_hugepage/enabled
      - name: Fetch pinned benchmark support
        id: generator
        run: |
          git fetch --no-tags origin ci-bench:refs/remotes/origin/ci-bench
          echo "tree=$(git rev-parse origin/ci-bench:generator)" >> "$GITHUB_OUTPUT"
          git checkout origin/ci-bench -- generator fixtures scripts
      - name: Run candidate x86 unit tests
        if: matrix.run_tests == 'true'
        env:
          TEST_REF: ${{ matrix.candidate_ref }}
        run: |
          testdir="$RUNNER_TEMP/candidate-test"
          mkdir -p "$testdir"
          git archive --format=tar "$TEST_REF" | tar -x -C "$testdir"
          cd "$testdir"
          cargo test --locked
      - name: Restore 20M corpus cache
        id: corpus
        uses: actions/cache@v4
        with:
          path: ~/big20
          key: big20-${{ runner.os }}-seed${{ env.DATA_SEED }}-${{ steps.generator.outputs.tree }}
      - run: python3 -m pip install --quiet polars
      - name: Generate 20M corpus on a cache miss
        if: steps.corpus.outputs.cache-hit != 'true'
        run: |
          cargo build --release --locked --manifest-path generator/Cargo.toml
          generator/target/release/generate --seed "$DATA_SEED" --events 20000000 --clicks 5000000 --output "$HOME/big20"
      - uses: actions/download-artifact@v4
        with:
          name: image-baseline
          path: ${{ runner.temp }}/images/baseline
      - uses: actions/download-artifact@v4
        with:
          name: image-${{ matrix.image }}
          path: ${{ runner.temp }}/images/candidate
      - name: Load baseline and candidate
        run: |
          for archive in "$RUNNER_TEMP"/images/*/*.tar.zst; do zstd -dc "$archive" | docker load; done
      - name: Gate and 8 alternating warm pairs (${{ matrix.label }})
        run: python3 bench/ci_bench.py "$HOME/big20" "$HOME/g7-bench" 2>&1 | tee "$HOME/g7-bench.log"
      - if: always()
        run: cat "$HOME/g7-bench/summary.md" >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result-${{ matrix.label }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |-
            ~/g7-bench.log
            ~/g7-bench/summary.md
            ~/g7-bench/observations.json
            ~/g7-bench/logs/**
          retention-days: 7
