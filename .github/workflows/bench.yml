name: gum v5 Intel gate and timing

on:
  push:
    branches: [ci/gum-person]
  workflow_dispatch:

jobs:
  gate-and-time:
    # ubuntu-latest is intentionally refused below unless GitHub assigns the
    # requested Cascade-Lake-class Intel/AVX-512 machine.
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Require the scoring-shaped Intel host
        shell: bash
        run: |
          set -euo pipefail
          lscpu
          grep -qm1 '^vendor_id.*GenuineIntel' /proc/cpuinfo || echo 'WARN: AMD runner (timing indicative only)'
          grep -qw avx512f /proc/cpuinfo || echo 'WARN: no AVX-512F'
          test "$(nproc)" -ge 4 || { echo "need 4+ vCPUs, got $(nproc)" >&2; exit 1; }; echo "RUNNER_VCPUS=$(nproc)" >> "$GITHUB_ENV"
          echo NCPU=8 >> "$GITHUB_ENV"
      - name: Install exact-check dependency
        run: python3 -m pip install --disable-pip-version-check polars
      - name: Build the supplied v5 generator and generate corpora
        shell: bash
        run: |
          set -euo pipefail
          unzip -q bench/assets/generator.zip -d "$HOME/gum-v5-generator"
          cargo build --release --locked --manifest-path "$HOME/gum-v5-generator/generator/Cargo.toml"
          # The supplied public dev-answer is the documented seed-1 dev set.
          "$HOME/gum-v5-generator/generator/target/release/generate" --seed 1 --events 1000000 --clicks 250000 --output "$HOME/v5-dev" --threads "$NCPU"
          "$HOME/gum-v5-generator/generator/target/release/generate" --seed 17 --events 20000000 --clicks 5000000 --output "$HOME/v5-20m" --threads "$NCPU"
          "$HOME/gum-v5-generator/generator/target/release/generate" --seed 17 --events 60000000 --clicks 15000000 --output "$HOME/v5-60m" --threads "$NCPU"
          du -sh "$HOME/v5-dev" "$HOME/v5-20m" "$HOME/v5-60m"
      - name: Gate candidate and interleave timing rounds
        shell: bash
        run: |
          set -euo pipefail
          python3 bench/ci_bench.py "$HOME" "$GITHUB_WORKSPACE/bench-work"
      - name: Publish benchmark evidence
        if: always()
        shell: bash
        run: |
          if test -f bench-work/summary.md; then cat bench-work/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gum-v5-intel-${{ github.run_id }}-${{ github.run_attempt }}
          path: bench-work/
          retention-days: 7
